<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardust & Pages - Welcome</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="door-page">

    <!-- خلفية الصورة الواسعة -->
    <div class="store-container">

        <!-- اللوحة الخشبية اليسرى الصغيرة العليا -->
        <div class="background-text-layer">

    <aside class="board top-left-board">
        <p>dream.<br>create.<br>collect.</p>
        <div class="star-icon">✦</div>
    </aside>

    <aside class="board floor-board">
        <p>take<br>your time,<br>stay<br>a while.</p>
        <div class="star-icon">✦</div>
    </aside>

</div>
        

        <!-- محتوى الباب الرئيسي -->
        <main class="door-content">
            <!-- أيقونة كوكب زحل -->
            <div class="planet-icon">
                <svg viewBox="0 0 100 60" width="60" height="40" fill="none" stroke="#e3c28d" stroke-width="2">
                    <ellipse cx="50" cy="30" rx="22" ry="18" fill="none" />
                    <path d="M 10 30 C 15 15, 85 15, 90 30 C 85 45, 15 45, 10 30" stroke="#e3c28d" stroke-width="2.5"/>
                </svg>
            </div>

            <!-- النجوم المتناثرة حول الشعار -->
            <div class="sparkles-container">
                <span class="sparkle sp-1">✦</span>
                <span class="sparkle sp-2">✦</span>
                <span class="sparkle sp-3">✦</span>
                <span class="sparkle sp-4">✦</span>
                <span class="sparkle sp-5">✦</span>
            </div>

            <!-- العنوان الرئيسي -->
            <h1 class="brand-title">
                Stardust
                <span class="ampersand-wrap">& Pages</span>
            </h1>

            <p class="brand-sub">STICKERS FOR DREAMERS</p>

            <div class="divider">
                <span>✦</span>
            </div>

            <!-- زر OPEN الذهبي Tonal -->
            <a href="main.html" id="openBtn" class="open-button">
                <span class="btn-star">✦</span>
                <span class="btn-text">OPEN</span>
                <span class="btn-star">✦</span>
            </a>
        </main>

        <!-- النجمة الذهبية على دواسة الباب -->
        <div class="mat-star">✦</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
